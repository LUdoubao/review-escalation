# 测试专用配置：覆盖主配置的数据源，指向独立的测试库，避免污染演示数据。
# 同名 application.yml 在测试类路径下优先级高于主配置，因此这里必须完整声明测试所需的配置项。
# 建表与种子数据复用主资源下的同一份脚本，保证测试与运行期的表结构、种子数据完全同源。
# 凭据同样不落库，由运行环境提供（DB_USERNAME / DB_PASSWORD）；
# 口令占位符不设默认值，缺失时测试上下文启动即失败。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/review_escalation_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
